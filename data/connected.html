<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blossom</title>
    <style>
        @font-face {
            font-family: 'Gluten';
            src: url('/fonts/Gluten.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
        }

        @font-face {
            font-family: 'Fredoka';
            src: url('/fonts/Fredoka.ttf') format('truetype');
            font-weight: 300 700;
            font-style: normal;
        }

        body {
            font-family: 'Fredoka', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            font-family: 'Gluten', Arial, sans-serif;
            color: #1e1e1e;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5rem;
            font-weight: 700;
            text-shadow: 2px 2px 0px #667eea;
            font-variation-settings: 'wght' 700, 'slnt' -10;
        }
        p {
            font-family: 'Fredoka', Arial, sans-serif;
            color: #555;
            font-size: 1.1rem;
            margin: 10px 0;
        }
        .status {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
        }
        .status strong {
            color: #2e7d32;
        }
        code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🪷 Blossom 🪷</h1>
        <p>Your ambient light display is connected!</p>
        <div class="status">
            <strong>✓ Status:</strong> Online<br>
            <strong>📡 Network:</strong> <span id="ssid">Loading...</span><br>
            <strong>🌐 IP:</strong> <span id="ip">Loading...</span><br>
            <strong>🔗 Hostname:</strong> <code>blossom.local</code>
        </div>
        <p style="color: #888; font-size: 0.9rem;">API endpoint: <code>http://blossom.local/api/effect</code></p>
    </div>
    <script>
        fetch('/api/status')
            .then(r => r.json())
            .then(data => {
                document.getElementById('ssid').textContent = data.ssid || 'Unknown';
                document.getElementById('ip').textContent = data.ip || 'Unknown';
            })
            .catch(e => console.error('Status fetch failed:', e));
    </script>
</body>
</html>
