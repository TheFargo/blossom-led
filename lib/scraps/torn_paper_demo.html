<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torn Paper & Playful Font Demo</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Gluten:wght@100..900&display=swap" rel="stylesheet">
    
    <style>
        /* --- Base Theme Setup --- */
        *, *::before, *::after {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #1e1e1e;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        /* --- Typography --- */
        h1 {
            font-family: 'Gluten', sans-serif;
            font-weight: 700;
            font-size: 2.8rem;
            text-align: center;
            margin-bottom: 10px;
            color: #1e1e1e; 
            text-shadow: 2px 2px 0px #667eea;
        }

        p.subtitle {
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: #242424;
        }

        h2 {
            font-family: 'Gluten', sans-serif;
            font-weight: 600;
            font-size: 1.6rem;
            margin-top: 0;
            color: #35a7ff;
        }

        /* --- Main Card Layout --- */
        .torn-paper-card {
            position: relative;
            padding: 30px;
            color: #1e1e1e;
            z-index: 1;
        }

        .torn-paper-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ffffff;
            border: 4px solid #1e1e1e;
            border-radius: 15px;
            box-shadow: 6px 6px 0px #5c3a7e;
            filter: url('#wriggly-base'); /* Base filter for large card */
            transform: rotate(0.5deg);
            z-index: -1;
        }

        /* --- Master Button Base Style --- */
        .control-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .torn-btn {
            position: relative;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: #1e1e1e;
            background: transparent; /* Allows pseudo-element to show through */
            border: 0;
            padding: 14px 22px;
            cursor: pointer;
            transition: transform 0.15s ease;
            z-index: 1;
        }

        /* The common wrapper for the background paper look */
        .torn-btn::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ffdf65; /* Default fallback color (Yellow) */
            border: 3px solid #1e1e1e;
            border-radius: 10px;
            box-shadow: 4px 4px 0px #1e1e1e;
            z-index: -1;
            transition: background-color 0.2s ease;
        }

        /* --- FIXED Button Color Variations --- */
        .torn-btn.coral::before { background-color: #ff858d; }
        .torn-btn.mint::before { background-color: #6bf1a4; }
        .torn-btn.lavender::before { background-color: #cca4ff; }

        /* --- AUTOMATIC Custom Layouts (Offsets & Unique Tears) --- */
        /* By changing seeds and micro-rotations, each button looks uniquely hand-made */
        .control-grid .torn-btn:nth-child(1)::before {
            filter: url('#wriggly-btn-1');
            transform: rotate(1.2deg);
        }
        .control-grid .torn-btn:nth-child(2)::before {
            filter: url('#wriggly-btn-2');
            transform: rotate(-1.5deg);
        }
        .control-grid .torn-btn:nth-child(3)::before {
            filter: url('#wriggly-btn-3');
            transform: rotate(0.8deg);
        }
        .control-grid .torn-btn:nth-child(4)::before {
            filter: url('#wriggly-btn-4');
            transform: rotate(-1deg);
        }

        /* --- Interaction States --- */
        .torn-btn:hover {
            transform: scale(1.05) translateY(-2px);
        }
        
        .torn-btn:hover::before {
            background-color: #ffffff; /* Turns clean paper-white on hover */
        }

        .torn-btn:active {
            transform: translate(2px, 2px);
        }
        .torn-btn:active::before {
            box-shadow: 2px 2px 0px #1e1e1e;
        }
    </style>
</head>
<body>

    <svg style="position: absolute; width: 0; height: 0;">
        <defs>
            <filter id="wriggly-base">
                <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="99" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G" />
            </filter>
            
            <filter id="wriggly-btn-1">
                <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="12" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" />
            </filter>
            
            <filter id="wriggly-btn-2">
                <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="45" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" />
            </filter>
            
            <filter id="wriggly-btn-3">
                <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="78" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" />
            </filter>
            
            <filter id="wriggly-btn-4">
                <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="101" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <div class="container">
        <h1>🪷 Blossom Styles Test Page 🪷</h1>
        <p class="subtitle">A pure CSS demo of the "torn-paper" effect paired with the <strong>Gluten</strong> font.</p>

        <div class="torn-paper-card">
            <h2>Torn Paper Card</h2>
            <p>This card uses a pseudo-element to create a torn paper effect. Notice how each button below has an entirely individual outline and tilt pattern!</p>
            
            <div class="control-grid">
                <button class="torn-btn coral">Neon Sunset</button>
                <button class="torn-btn mint">Cyber Punk</button>
                <button class="torn-btn lavender">Acid Rain</button>
                <button class="torn-btn">Electric Jam</button>
            </div>
        </div>
    </div>

</body>
</html>
